name: 🔌 MCP Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'koan/app/apiclient/**'
      - 'koan/app/mcp/**'
      # The x-koan-mcp marker plumbing: a change here can alter which
      # operations become named tools without touching koan/openapi.yaml.
      - 'koan/app/api/openapi_gen.py'
      - 'koan/app/api/openapi_metadata.py'
      - 'koan/tests_mcp/**'
      - 'koan/requirements-mcp.txt'
      - 'koan/openapi.yaml'
      - 'Makefile'
      - '.github/workflows/mcp-tests.yml'
  workflow_dispatch:

concurrency:
  group: mcp-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: mcp-sdk-tests

    steps:
      - uses: actions/checkout@v7

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            koan/requirements.txt
            koan/requirements-mcp.txt

      - name: 📦 Install dependencies
        run: |
          pip install -r koan/requirements.txt
          pip install -r koan/requirements-mcp.txt
          pip install pytest

      - name: ▶️ Run MCP SDK tests
        working-directory: koan
        env:
          KOAN_ROOT: ${{ github.workspace }}/koan
          PYTHONPATH: "."
        run: pytest tests_mcp/ -v
