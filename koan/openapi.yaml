      properties:
        error:
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
          type: object
      required:
      - error
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
info:
  description: Optional, token-authenticated HTTP control layer for the Kōan agent. See docs/operations/rest-api.md.
  title: Kōan REST API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/config:
    get:
      description: The response also includes the configured project names and local paths.
      operationId: admin_get_config_get
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Get the effective configuration with secrets masked.
      tags:
      - admin
      x-koan-mcp: true
      x-koan-mcp-description: Use to inspect effective settings and known projects. Secret-looking values are masked and cannot be recovered through this tool.
  /v1/health:
    get:
      description: 'This public endpoint returns the service name and version without

        checking authentication or agent execution state.'
      operationId: health_get
      responses:
        '200':
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      security: []
      summary: Check whether the REST API is alive.
      tags:
      - health
      x-koan-mcp: true
      x-koan-mcp-description: Use this only to check REST API reachability. Use `koan_status` for normal orientation and agent readiness.
  /v1/logs:
    get:
      description: 'Returns bounded run, bridge, or combined log lines without following the

        files continuously.'
      operationId: observability_logs_get
      parameters:
      - description: Log source to read.
        in: query
        name: source
        required: false
        schema:
          default: all
          enum:
          - run
          - awake
          - all
          type: string
      - description: Maximum lines returned per source.
        in: query
        name: limit
        required: false
        schema:
          default: 200
          maximum: 2000
          minimum: 1
          type: integer
      - description: Case-insensitive substring filter.
        in: query
        name: q
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Tail recent agent logs, optionally filtered by source.
      tags:
      - observability
      x-koan-mcp: true
      x-koan-mcp-description: Use for recent diagnostic context. Keep `limit` small first, then narrow with `source` or the case-insensitive `q` filter.
  /v1/metrics:
    get:
      description: An optional project filter returns project-specific metrics and trend.
      operationId: observability_metrics_get
      parameters:
      - description: Lookback window; values are clamped to the documented range.
        in: query
        name: days
        required: false
        schema:
          default: 30
          maximum: 365
          minimum: 0
          type: integer
      - description: Return metrics and trend for one project.
        in: query
        name: project
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Report mission throughput and success metrics over a window.
      tags:
      - observability
      x-koan-mcp: true
      x-koan-mcp-description: Use for throughput, success-rate, trend, and security-block measurements rather than raw token consumption.
  /v1/missions:
    get:
      description: 'Status and project filters narrow the response. Each record is reconciled

        against `missions.md` before it is returned.'
      operationId: missions_list_missions_route_get
      parameters:
      - description: Restrict results to one mission status.
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - in_progress
          - done
          - failed
          - removed
          type: string
      - description: Restrict results to one project.
        in: query
        name: project
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: List missions, newest first, optionally filtered.
      tags:
      - missions
      x-koan-mcp: true
      x-koan-mcp-description: Use this to browse or filter queues. Do not poll it for one mission's completion; use `koan_missions_get` with that mission id.
    post:
      description: 'The mission is appended to the pending queue for a later agent cycle.

        Setting `urgent` inserts it at the front instead.'
      operationId: missions_create_mission_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - properties:
                  command:
                    pattern: \S
                required:
                - command
              - properties:
                  text:
                    pattern: \S
                required:
                - text
              properties:
                command:
                  description: Slash-command mission; takes precedence over text.
                  type: string
                project:
                  description: Optional project name added as a project tag.
                  type: string
                text:
                  description: Free-form mission text.
                  type: string
                urgent:
                  default: false
                  description: Insert the mission at the front of the pending queue.
                  type: boolean
              type: object
        required: true
      responses:
        '202':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Queue a new mission.
      tags:
      - missions
      x-koan-mcp: true
      x-koan-mcp-description: Supply exactly one of `command` or `text`; a call with neither is rejected. The returned id identifies queued work, not a completed result. Poll `koan_missions_get`, then call `koan_missions_result` after status becomes `done`.
  /v1/missions/reorder:
    post:
      description: Reordering changes queue priority without editing the mission text.
      operationId: missions_reorder_mission_route_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                mission_id:
                  description: Identifier of the pending mission to move.
                  pattern: \S
                  type: string
                target_position:
                  description: One-indexed position in the pending queue.
                  minimum: 1
                  type: integer
              required:
              - mission_id
              - target_position
              type: object
        required: true
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Move a pending mission to a new position.
      tags:
      - missions
      x-koan-mcp: true
      x-koan-mcp-description: Only pending missions can be reordered. Obtain the mission id from `koan_missions_list` and use a one-indexed target position.
  /v1/missions/{mission_id}:
    delete:
      description: The mission is removed from the queue and its API record is cancelled.
      operationId: missions_delete_mission_delete
      parameters:
      - description: Mission identifier returned when the mission was queued.
        in: path
        name: mission_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Remove a pending mission.
      tags:
      - missions
      x-koan-mcp: true
      x-koan-mcp-description: This destructive tool is available only when `mcp.tools_allow_destructive` is enabled, and it accepts pending missions only.
    get:
      description: 'Returns lifecycle state, outcome metadata, result references, and

        aggregated usage for the selected mission.'
      operationId: missions_get_mission_route_get
      parameters:
      - description: Mission identifier returned when the mission was queued.
        in: path
        name: mission_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Fetch one mission by id.
      tags:
      - missions
      x-koan-mcp: true
      x-koan-mcp-description: Use this to poll one queued mission. When its status is `done`, fetch the complete structured result with `koan_missions_result`.
    patch:
      operationId: missions_edit_mission_patch
      parameters:
      - in: path
        name: mission_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                text:
                  pattern: \S
                  type: string
              required:
              - text
              type: object
        required: true
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Change a pending mission.
      tags:
      - missions
  /v1/missions/{mission_id}/result:
    get:
      description: 'Inline and spilled results use the same HTTP response, so clients never

        need filesystem access.'
      operationId: missions_get_mission_result_route_get
      parameters:
      - description: Mission identifier returned when the mission was queued.
        in: path
        name: mission_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Fetch a finished mission's result.
      tags:
      - missions
      x-koan-mcp: true
      x-koan-mcp-description: Call this after `koan_missions_get` reports `done`. It returns the complete structured result and reports not found when no structured result is available.
  /v1/pause:
    post:
      description: 'Supported durations include `2h`, `30m`, and combined forms such as

        `1h30m`.'
      operationId: admin_pause_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                duration:
                  description: Duration such as 2h, 30m, or 1h30m; omit for indefinite.
                  type: string
              type: object
        required: false
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Pause the agent indefinitely or for a relative duration.
      tags:
      - admin
      x-koan-mcp: true
      x-koan-mcp-description: Omit `duration` for an indefinite pause. A timed retry computes a fresh deadline and can extend the pause, so do not retry it automatically after an ambiguous timeout.
  /v1/projects:
    get:
      description: 'Returns each configured project name, local path, and GitHub URL when one

        is available.'
      operationId: projects_list_projects_get
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: List watched projects.
      tags:
      - projects
      x-koan-mcp: true
      x-koan-mcp-description: Use the returned project names as `project` values when creating or filtering missions.
    post:
      operationId: projects_add_project_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                github_url:
                  pattern: \S
                  type: string
                name:
                  type: string
              required:
              - github_url
              type: object
        required: true
      responses:
        '201':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Add a project to watch.
      tags:
      - projects
  /v1/projects/{name}:
    delete:
      operationId: projects_delete_project_delete
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Remove a watched project.
      tags:
      - projects
    patch:
      operationId: projects_patch_project_patch
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                patch:
                  additionalProperties: false
                  properties:
                    autoreview:
                      type: boolean
                    cli_provider:
                      type: string
                    devcontainer:
                      type: boolean
                    exploration:
                      type: boolean
                    focus:
                      type: boolean
                    git_auto_merge.base_branch:
                      type: string
                    git_auto_merge.enabled:
                      type: boolean
                    git_auto_merge.strategy:
                      enum:
                      - squash
                      - merge
                      - rebase
                      type: string
                    github_url:
                      type: string
                    max_open_prs:
                      type: integer
                    max_pending_branches:
                      type: integer
                    rtk:
                      type: boolean
                  type: object
              required:
              - patch
              type: object
        required: true
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Update a watched project's configuration.
      tags:
      - projects
  /v1/restart:
    post:
      operationId: admin_restart_post
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Request a full agent restart.
      tags:
      - admin
  /v1/resume:
    post:
      description: Removes the active pause marker and leaves queued missions unchanged.
      operationId: admin_resume_post
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Resume the agent after a pause.
      tags:
      - admin
      x-koan-mcp: true
      x-koan-mcp-description: Use after a manual or timed pause when work should resume. Repeating this call has no additional effect.
  /v1/shutdown:
    post:
      operationId: admin_shutdown_post
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Gracefully stop the agent.
      tags:
      - admin
  /v1/status:
    get:
      description: 'Combines execution state, queue counts, signal flags, pause details, and

        attention count in one response.'
      operationId: status_status_get
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Get current agent state, execution and mission counters.
      tags:
      - status
      x-koan-mcp: true
      x-koan-mcp-description: Use this inexpensive call first to orient yourself before choosing a mission, observability, or control tool.
  /v1/update:
    post:
      operationId: admin_update_post
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Pull upstream changes and restart.
      tags:
      - admin
  /v1/update_release:
    post:
      operationId: admin_update_release_post
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Check out the latest tagged release and restart.
      tags:
      - admin
  /v1/usage:
    get:
      description: 'Results can be bucketed by day, week, or month and optionally split or

        filtered by project.'
      operationId: observability_usage_get
      parameters:
      - description: Window length; values are clamped to the documented range.
        in: query
        name: days
        required: false
        schema:
          default: 7
          maximum: 100
          minimum: 1
          type: integer
      - description: Shift the window back by this many granularity units.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Series bucketing granularity.
        in: query
        name: granularity
        required: false
        schema:
          default: day
          enum:
          - day
          - week
          - month
          type: string
      - description: Include a per-project series breakdown.
        in: query
        name: stacked
        required: false
        schema:
          default: false
          type: boolean
      - description: Restrict totals and series to one project.
        in: query
        name: project
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or malformed bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid bearer token
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response
      summary: Report agent usage totals over a configurable window.
      tags:
      - observability
      x-koan-mcp: true
      x-koan-mcp-description: Use for token and cost accounting. Choose a bounded window and add `project` only when a per-project breakdown is needed.
security:
- bearerAuth: []
servers:
- description: Default loopback bind
  url: http://127.0.0.1:8420
tags:
- description: Config, pause/resume, restart, update and shutdown
  name: admin
- description: Liveness probe (no token required)
  name: health
- description: Queue, inspect, reorder and delete missions
  name: missions
- description: Logs, metrics and usage
  name: observability
- description: List, add, update and remove watched projects
  name: projects
- description: Current agent state, execution and mission counters
  name: status
